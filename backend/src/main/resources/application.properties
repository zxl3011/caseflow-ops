spring.application.name=caseflow-ops

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/caseflow_ops}
spring.datasource.username=${DB_USERNAME:caseflow_user}
spring.datasource.password=${DB_PASSWORD:caseflow_password}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.docker.compose.enabled=false

server.port=8080

app.jwt.secret=${JWT_SECRET:caseflow-dev-secret-key-change-this-before-production-caseflow-ops}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
